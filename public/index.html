<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8AA0F7" />
  <meta name="description" content="라켓로비 - 배드민턴 동호인 모임·게임 관리" />
  <title>라켓로비 · 로그인</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="라켓로비" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%20512%20512'%3E%3Crect%20width='512'%20height='512'%20fill='%238b7cf6'/%3E%3Cpath%20d='M206%20318%20L256%20150%20L306%20318%20Z'%20fill='white'/%3E%3Ccircle%20cx='256'%20cy='336'%20r='48'%20fill='white'/%3E%3C/svg%3E" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/ds.css" />
  <script src="/env.js"></script>
  <script src="/confirmModal.js"></script>
  <script>document.addEventListener('gesturestart', (e) => e.preventDefault());</script>
</head>
<body class="page-fade-in">
  <div class="auth-screen">
    <div class="logo-wrap">
      <div class="logo-circle">🏸</div>
      <div class="logo-title">라켓로비</div>
      <div class="logo-sub">배드민턴 동호인 로비</div>
    </div>
    <form class="card" id="login-form" novalidate>
      <label class="field"><span>아이디</span>
        <input name="username" autocomplete="username" placeholder="아이디" required />
      </label>
      <label class="field"><span>비밀번호</span>
        <input name="password" type="password" autocomplete="current-password" placeholder="비밀번호" required />
      </label>
      <button type="submit" class="btn btn-primary" id="login-btn">로그인</button>
    </form>
    <p class="switch">아직 회원이 아니신가요? <a href="/signup.html">회원가입</a></p>
  </div>

  <script type="module">
    import { sb, usernameToEmail, CONFIG_OK } from '/js/supabase.js';
    import { toast } from '/js/util.js';

    if (!CONFIG_OK) {
      document.querySelector('.auth-screen').innerHTML =
        '<div class="card"><h3>설정 필요</h3><p style="margin-top:8px;color:#666;font-size:13px">서버에 SUPABASE_URL / SUPABASE_ANON_KEY 환경변수가 없습니다.</p></div>';
    } else {
      // 이미 로그인 상태면 로비로
      sb.auth.getSession().then(({ data }) => { if (data.session) location.replace('/lobby.html'); });

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = document.getElementById('login-btn');
        const fd = new FormData(e.target);
        const username = String(fd.get('username') || '').trim();
        const password = String(fd.get('password') || '');
        if (!username || !password) return toast('아이디와 비밀번호를 입력하세요.', 'error');
        btn.disabled = true; btn.textContent = '로그인 중…';
        const { error } = await sb.auth.signInWithPassword({ email: usernameToEmail(username), password });
        if (error) {
          btn.disabled = false; btn.textContent = '로그인';
          return toast('아이디 또는 비밀번호가 올바르지 않습니다.', 'error');
        }
        location.replace('/lobby.html');
      });
    }
  </script>
  <script>
    if ('serviceWorker' in navigator) window.addEventListener('load', () => navigator.serviceWorker.register('/sw.js').catch(() => {}));
  </script>
</body>
</html>
