<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#8AA0F7" />
  <title>게임 · 라켓로비</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/ds.css" />
  <script src="/env.js"></script>
  <script src="/confirmModal.js"></script>
  <script>document.addEventListener('gesturestart', (e) => e.preventDefault());</script>
  <style>
    .member-item { background:#fff; border-radius:14px; padding:12px 14px; display:flex; gap:12px; align-items:center; box-shadow:0 2px 8px rgba(0,0,0,.06); margin-top:5px; margin-bottom:5px;  }
    .match-list { display:flex; flex-direction:column; gap:10px; }
	div.board-col { margin-top:20px; margin-bottom:20px; }
	aside.side-col { margin-top:20px; margin-bottom:20px; }
	.attend-summary { margin-bottom:10px; }
	.side-list { border:2px solid #4FB8A4; border-radius:14px; padding:10px; }
  </style>
</head>
<body class="home-mode page-fade-in">
  <div class="wrapper home-mode" id="wrap">
    <header class="sub-header">
      <button class="sub-back-btn" id="btn-back" aria-label="뒤로">←</button>
      <div class="sub-title">게임</div>
      <div class="sub-actions"></div>
    </header>
    <main class="content" id="game-main"><div class="empty">불러오는 중…</div></main>
  </div>

  <script type="module">
    import { sb } from '/js/supabase.js';
    import { requireAuth, goPage } from '/js/guard.js';
    import { esc, initials, fmtDateTime, expText, gradeSummary, toast } from '/js/util.js';

    const auth = await requireAuth();
    if (!auth) throw new Error('no auth');
    const gameId = new URLSearchParams(location.search).get('id');
    const wrap = document.getElementById('wrap');
    const PC_BREAK = 900;
    let gctx = null, isPCMode = false, backRoom = null;

    document.getElementById('btn-back').addEventListener('click', () => goPage(backRoom ? '/room.html?id=' + backRoom : '/lobby.html'));
    if (!gameId) { document.getElementById('game-main').innerHTML = '<div class="empty">잘못된 접근입니다.</div>'; throw new Error('no id'); }

    let t; window.addEventListener('resize', () => { clearTimeout(t); t = setTimeout(() => { if (gctx && (window.innerWidth >= PC_BREAK) !== isPCMode) render(); }, 180); });

    async function load() {
      const [gameRes, partRes, matchRes] = await Promise.all([
        sb.from('games').select('id, room_id, play_at, location, courts, max_players').eq('id', gameId).maybeSingle(),
        sb.from('game_participants').select('games_played, user:profiles(id, name, avatar_url, gender, exp_start, grade_region, grade_national)').eq('game_id', gameId),
        sb.from('matches').select('id, status, court, created_at, players:match_players(user:profiles(id, name, avatar_url, gender))').eq('game_id', gameId).order('created_at', { ascending: true }),
      ]);
      const main = document.getElementById('game-main');
      if (gameRes.error || !gameRes.data) { main.innerHTML = '<div class="empty">게임을 찾을 수 없어요. (삭제되었을 수 있습니다)</div>'; return; }
      const game = gameRes.data; backRoom = game.room_id;
      const canManage = (await sb.rpc('has_room_perm', { p_room_id: game.room_id, p_perm: 'operate_game' })).data === true;
      const participants = (partRes.data || []).filter((r) => r.user).map((r) => ({ ...r.user, games_played: r.games_played }));
      const matches = matchRes.data || [];
      const statusMap = {}; matches.forEach((m) => (m.players || []).forEach((pp) => { if (pp.user) statusMap[pp.user.id] = m.status; }));
      gctx = { game, participants, matches, canManage, statusMap };
      render();
    }

    const statusLabel = (id) => { const s = gctx.statusMap[id]; return s === 'playing' ? ' <span class="badge playing">게임중</span>' : s === 'waiting' ? ' <span class="badge wait">게임 대기</span>' : ' <span class="badge idle">휴식</span>'; };
    const genderLabel = (g) => g === 'male' ? '남' : g === 'female' ? '여' : '-';
    const pInfo = (u, wg) => `${genderLabel(u.gender)} · 구력 ${expText(u.exp_start)} · ${gradeSummary(u.grade_region, u.grade_national)}${wg ? ` · 게임 ${u.games_played ?? 0}회` : ''}`;
    const playerNames = (m) => (m.players || []).map((p) => esc(p.user?.name || '?')).join(' · ');
    const matchType = (gs) => { if (!gs || gs.length < 4) return null; const m = gs.filter((g) => g === 'male').length, f = gs.filter((g) => g === 'female').length; if (m === 4) return { label: '남복', cls: 'type-m' }; if (f === 4) return { label: '여복', cls: 'type-f' }; if (m === 2 && f === 2) return { label: '혼복', cls: 'type-x' }; return { label: '혼성', cls: 'type-x' }; };
    const typeBadge = (m) => { const t = matchType((m.players || []).map((p) => p.user?.gender)); return t ? `<span class="type-badge ${t.cls}">${t.label}</span>` : ''; };
    const avatarHTML = (u) => u.avatar_url ? `<img src="${esc(u.avatar_url)}" alt="">` : esc(initials(u.name));

    function infoCard() { const { game } = gctx; return `<section class="card"><h2 style="font-size:18px;font-weight:800;margin-bottom:10px">🗓️ ${fmtDateTime(game.play_at)}</h2><div style="display:flex;flex-direction:column;gap:6px;font-size:13.5px;color:var(--muted)">${game.location ? `<div>📍 ${esc(game.location)}</div>` : ''}<div>🏸 코트 ${game.courts}면 · 정원 ${game.max_players}명</div></div></section>`; }
    function summaryHTML() { const { participants, statusMap } = gctx; const p = participants.filter((u) => statusMap[u.id] === 'playing').length, w = participants.filter((u) => statusMap[u.id] === 'waiting').length, i = participants.length - p - w; return `<div class="attend-summary"><span class="as-play">게임중 ${p}</span><span class="as-wait">게임 대기 ${w}</span><span class="as-idle">휴식 ${i}</span></div>`; }
    function waitCard(m) { const { canManage } = gctx; return `<div class="match-card"><div class="match-info">${typeBadge(m)}<div class="match-players">${playerNames(m)}</div></div>${canManage ? `<div class="match-actions"><button class="mini-btn ok" data-assign="${m.id}">코트 지정</button><button class="mini-btn no" data-cancel="${m.id}">취소</button></div>` : ''}</div>`; }
    function playCard(m) { const { canManage } = gctx; return `<div class="match-card playing"><div class="match-info"><span class="court-tag">코트 ${m.court}</span>${typeBadge(m)}<div class="match-players">${playerNames(m)}</div></div>${canManage ? `<button class="mini-btn done" data-complete="${m.id}">완료</button>` : ''}</div>`; }
    function courtBoard() { const { game, matches, canManage } = gctx; const byCourt = {}; matches.filter((m) => m.status === 'playing').forEach((m) => (byCourt[m.court] = m)); let out = ''; for (let c = 1; c <= game.courts; c++) { const m = byCourt[c]; out += m ? `<div class="court-card busy"><div class="court-num">코트 ${c}</div><div class="court-body">${typeBadge(m)}<div class="match-players">${playerNames(m)}</div></div>${canManage ? `<button class="mini-btn done" data-complete="${m.id}">완료</button>` : ''}</div>` : `<div class="court-card empty"><div class="court-num">코트 ${c}</div><div>빈 코트</div></div>`; } return out; }
    function attendeeRows() { const { participants, canManage, statusMap } = gctx; if (!participants.length) return '<div class="empty">참석자를 추가해 주세요.</div>'; return participants.map((u) => `<div class="member-item"><div class="avatar sm">${avatarHTML(u)}</div><div class="m-meta"><div class="m-name">${esc(u.name)}${statusLabel(u.id)}</div><div class="m-tags">${esc(pInfo(u, true))}</div></div>${canManage && !statusMap[u.id] ? `<button class="mini-btn no" data-rm-part="${u.id}">제외</button>` : ''}</div>`).join(''); }

    function render() {
      const { game, participants, matches, canManage } = gctx;
      const waiting = matches.filter((m) => m.status === 'waiting'), playing = matches.filter((m) => m.status === 'playing');
      const main = document.getElementById('game-main');
      isPCMode = window.innerWidth >= PC_BREAK; wrap.classList.toggle('pc-game', isPCMode);
      const waitList = waiting.length ? `<div class="match-list">${waiting.map(waitCard).join('')}</div>` : '<div class="empty">대기 중인 게임이 없어요.</div>';
      const addBtns = canManage ? `<button class="mini-btn ok" id="btn-add-part">＋ 참석자</button><button class="mini-btn ok" id="btn-add-wait">＋ 대기 등록</button>` : '';

      if (isPCMode) {
        main.innerHTML = `<div class="game-page pc">${infoCard()}<div class="game-layout"><div class="board-col"><div class="section-head"><h2>코트 (${game.courts})</h2><div class="head-actions">${addBtns}</div></div><div class="court-board">${courtBoard()}</div><div class="section-head"><h2>대기 (${waiting.length})</h2></div>${waitList}</div><aside class="side-col"><div class="section-head"><h2>참석자 (${participants.length}/${game.max_players})</h2></div>${summaryHTML()}<div class="side-list">${attendeeRows()}</div></aside></div></div>`;
      } else {
        main.innerHTML = `<div class="game-page">${infoCard()}<section class="section"><div class="section-head"><h2>참석자 (${participants.length}/${game.max_players})</h2><div class="head-actions"><button class="mini-btn ghost" id="btn-status">현황</button>${canManage ? '<button class="mini-btn ok" id="btn-add-part">＋ 추가</button>' : ''}</div></div>${summaryHTML()}</section><section class="section"><div class="section-head"><h2>대기 (${waiting.length})</h2>${canManage ? '<button class="mini-btn ok" id="btn-add-wait">＋ 대기 등록</button>' : ''}</div>${waitList}</section><section class="section"><div class="section-head"><h2>게임중 (${playing.length})</h2></div>${playing.length ? `<div class="match-list">${playing.map(playCard).join('')}</div>` : '<div class="empty">진행 중인 게임이 없어요.</div>'}</section></div>`;
      }

      const sb2 = main.querySelector('#btn-status'); if (sb2) sb2.addEventListener('click', openStatusDrawer);
      const ap = main.querySelector('#btn-add-part'); if (ap) ap.addEventListener('click', openAddParticipant);
      const aw = main.querySelector('#btn-add-wait'); if (aw) aw.addEventListener('click', openAddWaiting);
      main.querySelectorAll('[data-assign]').forEach((b) => b.addEventListener('click', () => openCourtPicker(b.dataset.assign)));
      main.querySelectorAll('[data-cancel]').forEach((b) => b.addEventListener('click', () => completeMatch(b.dataset.cancel, '취소')));
      main.querySelectorAll('[data-complete]').forEach((b) => b.addEventListener('click', () => completeMatch(b.dataset.complete, '완료')));
      main.querySelectorAll('[data-rm-part]').forEach((b) => b.addEventListener('click', () => removeParticipant(b.dataset.rmPart)));
    }

    function openStatusDrawer() {
      const ov = document.createElement('div'); ov.className = 'drawer-overlay';
      ov.innerHTML = `<div class="drawer"><div class="drawer-head"><h3>참석자 현황</h3><button class="icon-btn" id="d-close">✕</button></div><div class="drawer-legend"><span class="badge playing">게임중</span><span class="badge wait">게임 대기</span><span class="badge idle">휴식</span></div><div class="drawer-body"><div class="list" id="d-list"></div></div></div>`;
      document.body.appendChild(ov); document.body.classList.add('modal-open');
      const close = () => { ov.remove(); document.body.classList.remove('modal-open'); };
      ov.addEventListener('click', (e) => { if (e.target === ov) close(); });
      ov.querySelector('#d-close').addEventListener('click', close);
      const listEl = ov.querySelector('#d-list');
      const fill = () => { listEl.innerHTML = attendeeRows(); listEl.querySelectorAll('[data-rm-part]').forEach((b) => b.addEventListener('click', async () => { await removeParticipant(b.dataset.rmPart); fill(); })); };
      fill();
    }

    async function openAddParticipant() {
      const { game, participants } = gctx;
      const { data } = await sb.from('room_members').select('user:profiles(id, name, gender, exp_start, grade_region, grade_national)').eq('room_id', game.room_id).eq('status', 'approved');
      const taken = new Set(participants.map((p) => p.id));
      const cands = (data || []).map((d) => d.user).filter((u) => u && !taken.has(u.id));
      const remain = game.max_players - participants.length;
      if (!cands.length) return toast('추가할 참석자가 없어요.', 'info');
      openChecklist({ title: '참석자 추가', items: cands.map((u) => ({ value: u.id, label: u.name, sub: pInfo(u, false) })), max: remain, remainText: (n) => `남은 자리 ${n}`, confirmText: '추가',
        onConfirm: async (ids) => { if (!ids.length) return toast('추가할 참석자를 선택하세요.', 'error'); if (ids.length > remain) return toast(`정원이 ${remain}명 남았어요.`, 'error'); for (const id of ids) { const { error } = await sb.rpc('add_game_participant', { p_game_id: gameId, p_user: id }); if (error) { console.error(error); toast('추가 실패: 정원을 확인하세요.', 'error'); break; } } load(); } });
    }
    function openAddWaiting() {
      const avail = gctx.participants.filter((u) => !gctx.statusMap[u.id]);
      if (avail.length < 4) return toast('대기 등록에는 대기 가능한 참석자 4명이 필요해요.', 'error');
      const gmap = {}; avail.forEach((u) => (gmap[u.id] = u.gender));
      openChecklist({ title: '대기 등록', items: avail.map((u) => ({ value: u.id, label: u.name, sub: pInfo(u, true) })), max: 4, remainText: (n) => (n > 0 ? `${n}명 더 선택` : '4명 선택 완료'), extraNote: (ids) => { if (ids.length !== 4) return ''; const t = matchType(ids.map((id) => gmap[id])); return t ? `경기 유형: ${t.label}` : ''; }, confirmText: '대기 등록',
        onConfirm: async (ids) => { if (ids.length !== 4) return toast('정확히 4명을 선택하세요.', 'error'); const { error } = await sb.rpc('create_waiting_match', { p_game_id: gameId, p_users: ids }); if (error) { console.error(error); return toast('대기 등록에 실패했습니다.', 'error'); } toast('대기에 등록했어요.', 'success'); load(); } });
    }
    function openCourtPicker(matchId) {
      const { game, matches } = gctx; const busy = new Set(matches.filter((m) => m.status === 'playing').map((m) => m.court)); const free = [];
      for (let c = 1; c <= game.courts; c++) if (!busy.has(c)) free.push(c);
      if (!free.length) return toast('빈 코트가 없어요.', 'error');
      const m = document.createElement('div'); m.className = 'modal-overlay';
      m.innerHTML = `<div class="modal"><div class="modal-head"><h3>코트 지정</h3><button class="icon-btn" id="c-close">✕</button></div><div class="modal-body"><div class="court-grid">${free.map((c) => `<button class="court-btn" data-court="${c}">코트 ${c}</button>`).join('')}</div></div></div>`;
      document.body.appendChild(m); document.body.classList.add('modal-open');
      const close = () => { m.remove(); document.body.classList.remove('modal-open'); };
      m.addEventListener('click', (e) => { if (e.target === m) close(); });
      m.querySelector('#c-close').addEventListener('click', close);
      m.querySelectorAll('[data-court]').forEach((b) => b.addEventListener('click', async () => { const { error } = await sb.rpc('assign_match_court', { p_match_id: matchId, p_court: Number(b.dataset.court) }); if (error) { console.error(error); return toast('코트 지정에 실패했습니다.', 'error'); } close(); toast(`코트 ${b.dataset.court}에 배정했어요.`, 'success'); load(); }));
    }
    async function removeParticipant(userId) { const { error } = await sb.rpc('remove_game_participant', { p_game_id: gameId, p_user: userId }); if (error) { console.error(error); return toast('제외에 실패했습니다.', 'error'); } await load(); }
    async function completeMatch(matchId, verb) { if (!(await showConfirm({ title: verb, message: `이 게임을 ${verb}할까요?`, confirmText: verb, danger: verb === '취소' }))) return; const { error } = await sb.rpc('complete_match', { p_match_id: matchId }); if (error) { console.error(error); return toast(`${verb}에 실패했습니다.`, 'error'); } toast(`${verb}했어요.`, 'info'); load(); }

    function openChecklist({ title, items, max, remainText, extraNote, confirmText, onConfirm }) {
      const m = document.createElement('div'); m.className = 'modal-overlay';
      m.innerHTML = `<div class="modal"><div class="modal-head"><h3>${esc(title)}</h3><button class="icon-btn" id="cl-close">✕</button></div><div class="modal-body">${max != null || extraNote ? '<div class="check-remain"><span id="cl-remain"></span><span id="cl-note" class="cl-note"></span></div>' : ''}<div class="checklist">${items.map((it) => `<label class="check-row"><input type="checkbox" value="${esc(it.value)}"/><span class="cr-main"><span class="cr-name">${esc(it.label)}</span>${it.sub ? `<span class="cr-sub">${esc(it.sub)}</span>` : ''}</span></label>`).join('')}</div><button class="btn btn-primary" id="cl-confirm">${esc(confirmText)}</button></div></div>`;
      document.body.appendChild(m); document.body.classList.add('modal-open');
      const close = () => { m.remove(); document.body.classList.remove('modal-open'); };
      m.addEventListener('click', (e) => { if (e.target === m) close(); });
      m.querySelector('#cl-close').addEventListener('click', close);
      const boxes = [...m.querySelectorAll('input[type=checkbox]')], remainEl = m.querySelector('#cl-remain'), noteEl = m.querySelector('#cl-note');
      const update = () => { const cb = boxes.filter((b) => b.checked); if (max != null) { const left = max - cb.length; boxes.forEach((b) => { if (!b.checked) b.disabled = cb.length >= max; }); if (remainEl) remainEl.textContent = remainText ? remainText(left) : `남은 선택 ${left}`; } if (noteEl && extraNote) noteEl.textContent = extraNote(cb.map((b) => b.value)) || ''; };
      m.querySelector('.checklist').addEventListener('change', update); update();
      m.querySelector('#cl-confirm').addEventListener('click', async () => { const ids = boxes.filter((b) => b.checked).map((b) => b.value); await onConfirm(ids); close(); });
    }

    let rt = null;
    rt = sb.channel(`game-${gameId}`)
      .on('postgres_changes', { event: '*', schema: 'public', table: 'game_participants', filter: `game_id=eq.${gameId}` }, () => load())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'matches', filter: `game_id=eq.${gameId}` }, () => load())
      .on('postgres_changes', { event: '*', schema: 'public', table: 'match_players' }, () => load())
      .subscribe();
    window.addEventListener('pagehide', () => { if (rt) sb.removeChannel(rt); });

    load();
  </script>
</body>
</html>
