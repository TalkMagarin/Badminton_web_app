<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#8AA0F7" />
  <title>모임 찾기 · 라켓로비</title>
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8F%B8%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/css/ds.css" />
  <script src="/env.js"></script>
  <script src="/confirmModal.js"></script>
  <script>document.addEventListener('gesturestart', (e) => e.preventDefault());</script>
</head>
<body class="home-mode page-fade-in">
  <div class="wrapper home-mode">
    <header class="sub-header">
      <button class="sub-back-btn" id="btn-back" aria-label="뒤로">←</button>
      <div class="sub-title">모임 찾기</div>
      <div class="sub-actions"><button class="icon-btn" id="btn-create-top" aria-label="모임 만들기">＋</button></div>
    </header>
    <main class="content">
      <button class="btn btn-primary" id="btn-create">＋ 모임 만들기</button>
      <section class="section">
        <div class="section-head"><input class="search wide" id="room-search" placeholder="모임명 검색 (비공개는 전체 입력)" /></div>
        <div class="list" id="room-list"><div class="empty">불러오는 중…</div></div>
      </section>
    </main>
  </div>

  <script type="module">
    import { sb } from '/js/supabase.js';
    import { requireAuth, goPage } from '/js/guard.js';
    import { GRADES, gradeLabel, esc, toast } from '/js/util.js';

    const auth = await requireAuth();
    if (!auth) throw new Error('no auth');
    const uid = auth.uid;

    document.getElementById('btn-back').addEventListener('click', () => goPage('/lobby.html'));
    document.getElementById('btn-create').addEventListener('click', openCreateModal);
    document.getElementById('btn-create-top').addEventListener('click', openCreateModal);
    let searchText = '';
    const search = document.getElementById('room-search');
    search.addEventListener('input', () => { searchText = search.value.trim().toLowerCase(); paint(); });

    let rooms = [];
    const memberCount = (r) => r.room_members?.[0]?.count ?? 0;

    async function load() {
      const { data, error } = await sb.from('rooms')
        .select('*, host:profiles!rooms_host_id_fkey(name, username), room_members(count)')
        .neq('status', 'closed').order('created_at', { ascending: false });
      const list = document.getElementById('room-list');
      if (error) { console.error(error); if (list) list.innerHTML = '<div class="empty">목록을 불러오지 못했습니다.</div>'; return; }
      rooms = data || []; paint();
    }
    function paint() {
      const list = document.getElementById('room-list'); if (!list) return;
      const rows = rooms.filter((r) => {
        const t = (r.title || '').toLowerCase(), mine = r.host_id === uid;
        if (!searchText) return !r.is_private || mine;
        if (r.is_private) return mine || t === searchText;
        return t.includes(searchText);
      });
      if (!rows.length) { list.innerHTML = `<div class="empty">${searchText ? '검색 결과가 없어요.' : '아직 열린 모임이 없어요.<br>첫 모임을 만들어 보세요!'}</div>`; return; }
      list.innerHTML = rows.map((r) => {
        const cnt = memberCount(r), full = cnt >= r.max_members;
        const gr = r.grade_min || r.grade_max ? `${gradeLabel(r.grade_min || r.grade_max)}${r.grade_min && r.grade_max && r.grade_min !== r.grade_max ? `~${gradeLabel(r.grade_max)}` : ''}` : '';
        const badges = (r.status === 'playing' ? '<span class="badge playing">경기중</span>' : '') + (r.is_private ? '<span class="badge private">비공개</span>' : '');
        return `<button class="list-card${full ? ' full' : ''}" data-id="${r.id}">
          <div class="list-main">
            <div class="list-title">${esc(r.title)} ${badges}</div>
            ${gr ? `<div class="list-sub"><span>🏅 ${esc(gr)}</span></div>` : ''}
            <div class="list-host">모임장 ${esc(r.host?.name || '알 수 없음')}</div>
          </div>
          <div class="count ${full ? 'is-full' : ''}"><span class="count-num">${cnt}/${r.max_members}</span><span class="count-label">${full ? '마감' : '모집중'}</span></div>
        </button>`;
      }).join('');
      list.querySelectorAll('.list-card').forEach((b) => b.addEventListener('click', () => onJoin(b.dataset.id)));
    }

    function onJoin(roomId) {
      const room = rooms.find((r) => r.id === roomId);
      if (room && room.is_private && room.host_id !== uid) return openPasswordPrompt(room);
      goPage('/room.html?id=' + roomId);
    }

    function openPasswordPrompt(room) {
      const m = document.createElement('div'); m.className = 'modal-overlay';
      m.innerHTML = `<div class="modal"><div class="modal-head"><h3>🔒 ${esc(room.title)}</h3><button class="icon-btn" id="p-close">✕</button></div>
        <form id="pw-form" class="modal-body">
          <label class="field"><span>모임 암호</span><input name="pw" type="password" placeholder="암호를 입력하세요" autocomplete="off" required /></label>
          <small class="hint">암호 확인 후 가입요청이 접수돼요. 승인 후 참여됩니다.</small>
          <button type="submit" class="btn btn-primary" style="margin-top:12px">가입요청</button>
        </form></div>`;
      document.body.appendChild(m); document.body.classList.add('modal-open');
      const close = () => { m.remove(); document.body.classList.remove('modal-open'); };
      m.addEventListener('click', (e) => { if (e.target === m) close(); });
      m.querySelector('#p-close').addEventListener('click', close);
      m.querySelector('#pw-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button'); const pw = String(new FormData(e.target).get('pw') || '');
        if (!pw) return toast('암호를 입력하세요.', 'error');
        btn.disabled = true; btn.textContent = '확인 중…';
        const { data, error } = await sb.rpc('join_room_with_password', { p_room_id: room.id, p_password: pw });
        btn.disabled = false; btn.textContent = '가입요청';
        if (error) { console.error(error); return toast('요청에 실패했습니다.', 'error'); }
        if (data === true) { close(); toast('가입 요청을 보냈어요!', 'success'); goPage('/room.html?id=' + room.id); }
        else toast('암호가 올바르지 않아요.', 'error');
      });
      setTimeout(() => m.querySelector('input[name=pw]')?.focus(), 50);
    }

    function openCreateModal() {
      const gradeOpts = () => '<option value="">무관</option>' + GRADES.map((g) => `<option value="${g.code}">${g.label}</option>`).join('');
      const m = document.createElement('div'); m.className = 'modal-overlay';
      m.innerHTML = `<div class="modal"><div class="modal-head"><h3>모임 만들기</h3><button class="icon-btn" id="m-close">✕</button></div>
        <form id="create-form" class="modal-body">
          <label class="field"><span>모임명</span><input name="title" placeholder="예) 오늘 저녁 복식 모임" required maxlength="40" /></label>
          <div class="field-row">
            <label class="field"><span>급수 하한</span><select name="grade_min">${gradeOpts()}</select></label>
            <label class="field"><span>급수 상한</span><select name="grade_max">${gradeOpts()}</select></label>
          </div>
          <label class="field"><span>정원 (명, 최대 500)</span><input name="max_members" type="number" inputmode="numeric" min="2" max="500" value="4" required /></label>
          <div class="field"><span>공개 설정</span>
            <div class="segmented" id="seg-vis"><button type="button" class="seg-btn active" data-v="false">공개</button><button type="button" class="seg-btn" data-v="true">비공개</button></div>
            <input type="hidden" name="is_private" value="false" />
            <small class="hint" id="vis-hint">누구나 모임 찾기에서 볼 수 있어요</small>
          </div>
          <label class="field" id="pw-field" style="display:none"><span>모임 암호</span><input name="room_password" type="password" placeholder="4자 이상" autocomplete="off" maxlength="30" /></label>
          <button type="submit" class="btn btn-primary" style="margin-top:8px">모임 만들기</button>
        </form></div>`;
      document.body.appendChild(m); document.body.classList.add('modal-open');
      const close = () => { m.remove(); document.body.classList.remove('modal-open'); };
      m.addEventListener('click', (e) => { if (e.target === m) close(); });
      m.querySelector('#m-close').addEventListener('click', close);
      const seg = m.querySelector('#seg-vis'), hid = m.querySelector('input[name=is_private]'),
        hint = m.querySelector('#vis-hint'), pwF = m.querySelector('#pw-field'), pwI = m.querySelector('input[name=room_password]');
      seg.addEventListener('click', (e) => {
        const b = e.target.closest('.seg-btn'); if (!b) return;
        seg.querySelectorAll('.seg-btn').forEach((x) => x.classList.toggle('active', x === b));
        const priv = b.dataset.v === 'true'; hid.value = b.dataset.v;
        hint.textContent = priv ? '모임 찾기에선 숨겨지고, 모임명 전체 검색 시 나와요. 암호 입력 후 가입요청.' : '누구나 모임 찾기에서 볼 수 있어요';
        pwF.style.display = priv ? '' : 'none'; if (!priv) pwI.value = '';
      });
      m.querySelector('#create-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = e.target.querySelector('button[type=submit]'); const fd = new FormData(e.target);
        const title = String(fd.get('title') || '').trim();
        if (!title) return toast('모임명을 입력하세요.', 'error');
        const max_members = Math.max(2, Math.min(500, Number(fd.get('max_members')) || 4));
        const is_private = fd.get('is_private') === 'true';
        const password = String(fd.get('room_password') || '');
        const grade_min = String(fd.get('grade_min') || '') || null, grade_max = String(fd.get('grade_max') || '') || null;
        if (is_private && password.length < 4) return toast('비공개 모임은 암호(4자 이상)를 설정하세요.', 'error');
        btn.disabled = true; btn.textContent = '생성 중…';
        const { data, error } = await sb.from('rooms').insert({ title, max_members, is_private, grade_min, grade_max, host_id: uid }).select('id').single();
        if (error) { btn.disabled = false; btn.textContent = '모임 만들기'; console.error(error); return toast('모임 생성에 실패했습니다.', 'error'); }
        if (is_private) {
          const { error: pe } = await sb.rpc('set_room_password', { p_room_id: data.id, p_password: password });
          if (pe) { console.error(pe); await sb.from('rooms').delete().eq('id', data.id); btn.disabled = false; btn.textContent = '모임 만들기'; return toast('암호 설정 실패. 다시 시도해 주세요.', 'error'); }
        }
        close(); toast('모임을 만들었어요!', 'success'); goPage('/room.html?id=' + data.id);
      });
    }

    let rt = null;
    function subscribe() {
      rt = sb.channel('find-db')
        .on('postgres_changes', { event: '*', schema: 'public', table: 'rooms' }, () => { clearTimeout(rt._t); rt._t = setTimeout(load, 250); })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'room_members' }, () => { clearTimeout(rt._t); rt._t = setTimeout(load, 250); })
        .subscribe();
    }
    window.addEventListener('pagehide', () => { if (rt) sb.removeChannel(rt); });

    load(); subscribe();
  </script>
</body>
</html>
